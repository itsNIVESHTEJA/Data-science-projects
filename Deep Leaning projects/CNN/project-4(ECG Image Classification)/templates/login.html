<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500">
  <div class="backdrop-blur-lg bg-white/10 border border-white/20 shadow-xl rounded-3xl p-10 w-full max-w-md text-center text-white">
    <i class="bx bxs-lock-alt text-5xl mb-4 text-white/80"></i>
    <h2 class="text-3xl font-bold mb-6">Login</h2>

    <form method="POST" class="space-y-4 text-left">
      <input class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-pink-300" name="username" type="text" placeholder="👤 Username" required>
      <input class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-pink-300" name="password" type="password" placeholder="🔑 Password" required>
      <button class="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-3 rounded-lg font-semibold hover:scale-105 transition-transform">Login</button>
    </form>

    <p class="mt-6 text-sm text-white/80">No account?
      <a href="{{ url_for('register') }}" class="font-bold hover:underline">Request Access</a>
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="fixed bottom-6 right-6 space-y-2">
          {% for category, message in messages %}
            <div class="px-4 py-3 rounded-lg shadow-lg {{ 'bg-green-500' if category=='success' else 'bg-red-500' }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
  </div>
</body>
</html>
