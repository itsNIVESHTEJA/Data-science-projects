<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
  body {
    background: url("{{ url_for('static', filename='cardiac-bg.jpg') }}") no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-tr from-green-500 via-teal-500 to-blue-600">
  <div class="backdrop-blur-lg bg-white/10 border border-white/20 shadow-xl rounded-3xl p-10 w-full max-w-md text-center text-white">
    <i class="bx bx-mail-send text-5xl mb-4 text-white/80"></i>
    <h2 class="text-3xl font-bold mb-2">Request Access</h2>
    <p class="text-white/80 mb-6">Your request will be reviewed by an admin.</p>

    <form method="POST" class="space-y-4 text-left">
      <input class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 placeholder-white/70" name="username" type="text" placeholder="👤 Username" required>
      <input class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 placeholder-white/70" name="email" type="email" placeholder="📧 Email" required>
      <input class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 placeholder-white/70" name="password" type="password" placeholder="🔑 Password" required>
      <input class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 placeholder-white/70" name="confirm" type="password" placeholder="🔁 Confirm Password" required>
      <button class="w-full bg-gradient-to-r from-green-500 to-teal-500 text-white py-3 rounded-lg font-semibold hover:scale-105 transition-transform">Submit Request</button>
    </form>

    <p class="mt-6 text-sm text-white/80">
      <a href="{{ url_for('login') }}" class="font-bold hover:underline">Back to Login</a>
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="fixed bottom-6 right-6 space-y-2">
          {% for category, message in messages %}
            <div class="px-4 py-3 rounded-lg shadow-lg {{ 'bg-green-500' if category=='success' else 'bg-red-500' }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
  </div>
</body>
</html>
