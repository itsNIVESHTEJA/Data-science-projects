<!DOCTYPE html>
<html lang="en">
<head>
 
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pending Users</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
   <style>
  body {
    background: url("{{ url_for('static', filename='cardiac-bg.jpg') }}") no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
  }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-700 via-purple-700 to-pink-600 text-white">
<div class="max-w-5xl mx-auto p-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold flex items-center gap-2">
      ECG Portal <i class="bx bx-pulse"></i>
    </h1>
    <div class="flex items-center gap-3">
      <span class="text-white/80">Hi, { username }</span>
      <a href="{{ url_for('logout') }}" class="px-3 py-2 rounded bg-white/10 hover:bg-white/20">Logout</a>

    </div>
  </div>

  <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-lg">
    <h2 class="text-2xl font-bold mb-4">Pending User Requests</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-left border border-white/20 rounded-lg overflow-hidden">
        <thead class="bg-white/10">
          <tr>
            <th class="p-3">Username</th>
            <th class="p-3">Email</th>
            <th class="p-3">Requested At</th>
            <th class="p-3">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for u in users %}
          <tr class="border-t border-white/10">
            <td class="p-3">{{ u.username }}</td>
            <td class="p-3">{{ u.email }}</td>
            <td class="p-3">{{ u.requested }}</td>
            <td class="p-3 flex gap-2">
              <form method="POST" action="{{ url_for('approve_user', username=u.username) }}">
                <button class="px-3 py-1 rounded bg-green-500 hover:bg-green-600">Approve</button>
              </form>
              <form method="POST" action="{{ url_for('reject_user', username=u.username) }}">
                <button class="px-3 py-1 rounded bg-rose-500 hover:bg-rose-600">Reject</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    <a class="inline-block mt-4 underline" href="{{ url_for('admin_dashboard') }}">⬅ Back</a>
  </div>

</div>
</body>
</html>
